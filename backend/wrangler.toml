# The miserere-api Worker: dev puzzle solve times (phase BE1), the play log
# (phase BE2a) and ballot verdicts (phase BV1a).
# Deployed by .github/workflows/backend-deploy.yml on a push to main touching
# backend/** (phase BE1b) to https://miserere-api.no-trbl-2-u.workers.dev.
# Locally: `npm test -w backend`, `npm run dev -w backend`.
name = "miserere-api"
main = "src/index.ts"
compatibility_date = "2026-03-01"

[[d1_databases]]
binding = "DB"
database_name = "miserere"
database_id = "d2933f80-97b3-44bf-bfca-3958dba331b8"
migrations_dir = "migrations"

# Two Worker secrets (`wrangler secret put <NAME>`), never [vars] entries;
# locally, `.dev.vars` holds them:
# - PUZZLE_API_TOKEN, the owner token: every route and method.
# - PUZZLE_TESTER_TOKEN (spec 163), the token a published APK carries: only
#   the POST of the app's routes (`tester: true` in src/index.ts). Optional;
#   unset, only the owner token opens anything.

# The origins the ballot routes answer CORS for (phase BV1a): the ballots
# Pages site and its branch previews. The site is the `card-ledger` Pages
# project, served at miserere-mei-deus.pages.dev; the axiomancer-ballots name
# is the one the docs first gave it and stays allowed. Not a secret.
[vars]
BALLOT_ORIGINS = "https://miserere-mei-deus.pages.dev,https://*.miserere-mei-deus.pages.dev,https://axiomancer-ballots.pages.dev,https://*.axiomancer-ballots.pages.dev"

# The retention cron (chunk 135.7): 05:17 UTC, after the 03:43 sim batch. It deletes sim and
# harness rows older than 14 days (src/retention.ts); human rows stay.
[triggers]
crons = ["17 5 * * *"]
