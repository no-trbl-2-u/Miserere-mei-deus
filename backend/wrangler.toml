# The miserere-api Worker: dev puzzle solve times (phase BE1), the play log
# (phase BE2a) and ballot verdicts (phase BV1a).
# Deployed by .github/workflows/backend-deploy.yml on a push to main touching
# backend/** (phase BE1b) to https://miserere-api.no-trbl-2-u.workers.dev.
# Locally: `npm test -w backend`, `npm run dev -w backend`.
name = "miserere-api"
main = "src/index.ts"
compatibility_date = "2026-03-01"

[[d1_databases]]
binding = "DB"
database_name = "miserere"
database_id = "d2933f80-97b3-44bf-bfca-3958dba331b8"
migrations_dir = "migrations"

# PUZZLE_API_TOKEN is a Worker secret (`wrangler secret put PUZZLE_API_TOKEN`),
# never a [vars] entry. Locally, `.dev.vars` holds it.

# The origins the ballot routes answer CORS for: the axiomancer-ballots Pages
# site and its branch previews (phase BV1a). Not a secret.
[vars]
BALLOT_ORIGINS = "https://axiomancer-ballots.pages.dev,https://*.axiomancer-ballots.pages.dev"
