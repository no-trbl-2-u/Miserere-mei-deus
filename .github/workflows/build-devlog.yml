name: build-devlog

# Rebuild the DevLog site on demand. The aggregate build refreshes the live
# catalog data/HTML first, then renders the DevLog hub and every structured
# digest entry. Generated output is uploaded as a workflow artifact only —
# it is never committed to main (phase 57 —
# archive-pre-revamp:plan/archive/2026-09-25-trim-t4/plan/phases/phase_57_devlog_pages_scopedown.md); the reachable path is
# `npm run site:build` run locally.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-loop
  cancel-in-progress: false

jobs:
  build:
    name: Build DevLog site
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Build catalog and DevLog
        run: npm run site:build

      - name: Validate generated site
        run: |
          test -s devlog/index.html
          test -s devlog/catalog.html
          test -s devlog/log.html

      - name: Upload DevLog site
        uses: actions/upload-artifact@v4
        with:
          name: axiomancer-devlog-${{ github.sha }}
          path: devlog/
          if-no-files-found: error
          retention-days: 14
