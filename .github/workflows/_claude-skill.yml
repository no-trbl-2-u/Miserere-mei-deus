name: _claude-skill

# Reusable runner for the Claude-powered automation workflows (the nexus
# loop verbs, the tuning loops, and the playtest loops). Every thin
# per-skill workflow calls this with a slash-command prompt; this file owns
# the shared setup so the action config lives in exactly one place.
#
# What it does, in order:
#   1. Checkout with full history (loop skills count commits / read
#      `git log --since`), using GH_PAT when configured so pushes made by
#      the skill trigger the verify-* workflows (the deploy gate).
#   2. Node 22 + `npm ci` so verify gates and mechanics CLIs run without
#      Claude spending turns on setup.
#   3. Optionally install the Playwright Chromium browser (mobile
#      expo-web playtest loops).
#   4. Materialize `.env` (GH_TOKEN / GH_REPO) — the skills load gh auth
#      from `.env` by design.
#   5. Self-test the nexus enforcement layer (.claude/settings.json is
#      committed and always active: guard hooks + deny walls for
#      force-push / --no-verify / destructive resets). CI runs are
#      unattended (intervention level 3+), so a broken guard must fail
#      the job before Claude starts.
#   6. Probe the remote kb-query MCP endpoint (warning only — a dead KB
#      must not sink an unrelated tick).
#   7. Run anthropics/claude-code-action with the given prompt.
#   8. With `loop_gates` (march, night): v2's after-the-model steps
#      (phase NX1f). The quota reading (scripts/cloud/quota.mjs read, its
#      cache for the next run's gate, the weekly-quota pause issue), and
#      for march the idle record and the no-op reason
#      (scripts/cloud/idle.mjs). The caller's `gate` job ran the
#      cadence, quota and idle gates before this job started.
#
# Tokens and secrets sit on the steps that use them, never in the job's
# env, which every step (the agent's included) would inherit
# (scripts/workflow-lint.mjs rule 2).
#
# Secrets (via `secrets: inherit` from callers):
#   CLAUDE_CODE_OAUTH_TOKEN  required — Claude subscription OAuth token.
#   GH_PAT                   recommended — classic PAT (repo + workflow
#                            scopes) or fine-grained token (contents,
#                            issues, pull-requests RW; actions read).
#                            Without it the default GITHUB_TOKEN is used
#                            and pushes/PRs made by the skills will NOT
#                            trigger the verify-* workflows — deploy-check
#                            then FAILS CLOSED on any code tick (zero
#                            verify runs for a code diff = exit 1, not a
#                            vacuous pass).
#   KB_MCP_TOKEN             recommended — bearer token for the remote
#                            kb-query MCP server. Without it the kb_* tools
#                            are granted but answer 401, and prior-art
#                            grounding degrades to model memory.
#   NOTIFY_NTFY_TOPIC        optional — scripts/notify.mjs pager channel.
#   NOTIFY_WEBHOOK_URL       optional — scripts/notify.mjs webhook channel.

on:
  workflow_call:
    inputs:
      prompt:
        description: 'Prompt passed to Claude (usually a repo slash command, e.g. "/march")'
        required: true
        type: string
      timeout_minutes:
        description: 'Job timeout'
        type: number
        default: 60
      install_playwright:
        description: 'Install Playwright Chromium (mobile expo-web loops) and grant the mcp__playwright__browser_* tools that the playtester/critic sub-agents need to drive it'
        type: boolean
        default: false
      extra_claude_args:
        description: 'Extra Claude Code CLI args appended to the defaults'
        type: string
        default: ''
      model:
        description: 'Model for the run. Default Sonnet 5; scheduled/high-frequency callers should stay on the default — premium tiers are for deliberate, manually dispatched passes.'
        type: string
        default: 'claude-sonnet-5'
      effort:
        description: 'Reasoning effort for models that support it (low|medium|high|xhigh|max). Empty = model default.'
        type: string
        default: ''
      allowed_tools:
        description: 'Override the --allowedTools list (comma-separated). Empty = the default loop grant. pr-resolve passes "Read,Edit" so its conflict run cannot run shell.'
        type: string
        default: ''
      pre_run:
        description: 'Shell run after setup and before Claude (pr-resolve checks out the PR branch and leaves conflict markers). Empty = none.'
        type: string
        default: ''
      post_run:
        description: 'Shell run after Claude succeeds (pr-resolve checks no marker remains, commits and pushes). Empty = none.'
        type: string
        default: ''
      loop_gates:
        description: 'v2 loop steps after the model: "march" (quota reading, pause, idle record, no-op reason) or "night" (quota reading, pause). Empty = none.'
        type: string
        default: ''
      reason:
        description: 'Why the run was dispatched (issue-<n>, chain; empty by hand), for the idle record.'
        type: string
        default: ''

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Install Playwright Chromium
        if: ${{ inputs.install_playwright }}
        run: npx playwright install chromium --with-deps
        working-directory: axiomancer-mobile

      - name: Materialize .env for the skills
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GH_REPO: ${{ github.repository }}
        # .nexus/ (claims hook markers, the quota and idle state) is never
        # committed: kept out of git before the agent runs.
        run: |
          printf 'GH_TOKEN=%s\nGH_REPO=%s\n' "$GH_TOKEN" "$GH_REPO" > .env
          grep -qx '.nexus/' .git/info/exclude 2>/dev/null || echo '.nexus/' >> .git/info/exclude

      - name: Self-test nexus enforcement layer (guard hooks + deny walls)
        run: node .claude/hooks/guard.mjs self-test

      # MCP grants in CI (phase 72, 2026-08-27):
      #
      #   axio-query  — GRANTED below. Its server is `scripts/axio-mcp-server.mjs`,
      #                 in the repo, so it starts wherever the checkout does. Without
      #                 it, engine-truth grounding degrades to file
      #                 reads on every unattended run (content-pipelines audit §6.4).
      #   kb-query    — GRANTED below (2026-08-31). Its server is a remote HTTP
      #                 endpoint the KB repo deploys: nothing to check out, no
      #                 sync step, no per-run download. Auth is a bearer token
      #                 out of the environment — `.mcp.json` references
      #                 ${KB_MCP_TOKEN} and Claude Code expands it from the
      #                 process env, NOT from the .env written above, which is
      #                 why the secret is set as step env below. It is also the
      #                 ONLY route to the corpus (no local fallback), so a tick
      #                 that cannot reach it cites nothing rather than citing
      #                 model memory as if it were a receipt.
      # Warning, never fatal: an unreachable KB degrades prior-art grounding
      # but has nothing to do with whether this tick's actual work can run.
      # Fail-closed on a 401 here would sink every loop on a token rotation.
      - name: Probe the kb-query MCP endpoint
        continue-on-error: true
        env:
          KB_MCP_TOKEN: ${{ secrets.KB_MCP_TOKEN }}
        run: |
          health=$(curl -sS -m 15 https://kb-mcp.no-trbl-2-u.workers.dev/health || echo '{}')
          echo "kb-query /health: $health"
          if [ -z "$KB_MCP_TOKEN" ]; then
            echo "::warning::KB_MCP_TOKEN is unset — kb_* tools are granted but will answer 401. Prior-art grounding is unavailable this run; claims from model memory must be marked UNGROUNDED."
            exit 0
          fi
          code=$(curl -sS -m 20 -o /dev/null -w '%{http_code}'             https://kb-mcp.no-trbl-2-u.workers.dev/mcp             -H "Authorization: Bearer $KB_MCP_TOKEN"             -H 'Content-Type: application/json'             -H 'Accept: application/json, text/event-stream'             -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' || echo 000)
          if [ "$code" = "200" ]; then
            echo "kb-query tools/list: 200 — prior-art grounding available"
          else
            echo "::warning::kb-query tools/list returned $code (401 = bad/rotated token, 503 = Worker secret missing). Tools are granted but unusable this run."
          fi

      - name: Resolve the tool grant
        id: tools
        shell: bash
        env:
          OVERRIDE: ${{ inputs.allowed_tools }}
          PLAYWRIGHT: ${{ inputs.install_playwright }}
        run: |
          if [ -n "$OVERRIDE" ]; then
            list="$OVERRIDE"
          else
            list="Bash,Edit,Write,Read,Glob,Grep,Task,TodoWrite,WebFetch,WebSearch,mcp__axio-query__axio_overview,mcp__axio-query__axio_cards,mcp__axio-query__axio_effects,mcp__axio-query__axio_keywords,mcp__kb-query__kb_overview,mcp__kb-query__kb_find_games,mcp__kb-query__kb_search,mcp__kb-query__kb_read_doc,mcp__kb-query__kb_cards,mcp__kb-query__kb_keyword"
            if [ "$PLAYWRIGHT" = "true" ]; then
              list="$list,mcp__playwright__browser_navigate,mcp__playwright__browser_click,mcp__playwright__browser_snapshot,mcp__playwright__browser_take_screenshot,mcp__playwright__browser_console_messages,mcp__playwright__browser_close,mcp__playwright__browser_resize,mcp__playwright__browser_press_key,mcp__playwright__browser_hover,mcp__playwright__browser_evaluate,mcp__playwright__browser_wait_for,mcp__playwright__browser_tabs,mcp__playwright__browser_network_requests,mcp__playwright__browser_navigate_back"
            fi
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Pre-run (caller-supplied)
        if: ${{ inputs.pre_run != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GH_REPO: ${{ github.repository }}
          PRE_RUN: ${{ inputs.pre_run }}
        run: bash -euo pipefail -c "$PRE_RUN"

      - name: Run Claude Code
        id: claude
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GH_REPO: ${{ github.repository }}
          NOTIFY_NTFY_TOPIC: ${{ secrets.NOTIFY_NTFY_TOPIC }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          KB_MCP_TOKEN: ${{ secrets.KB_MCP_TOKEN }}
          # This run's claims session (scripts/claims.mjs), so a later step
          # of the same tick renews and releases what it claimed.
          NEXUS_SESSION: cloud-${{ github.run_id }}
          # claude-code-action may not load project hooks, so claims.mjs
          # would refuse whoami and claim without this.
          NEXUS_NO_HOOK_CHECK: '1'
          # A gate leg can outrun the Bash tool's 10-minute default
          # ceiling. Foreground is the rule (backgrounded, it is lost
          # when the turn ends), so the ceiling is an hour, under the
          # job's own timeout (v2, nexus 9138cc4).
          BASH_MAX_TIMEOUT_MS: '3600000'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GH_PAT || github.token }}
          prompt: ${{ inputs.prompt }}
          show_full_output: true
          claude_args: |
            --model ${{ inputs.model }}
            ${{ inputs.effort != '' && format('--effort {0}', inputs.effort) || '' }}
            --allowedTools "${{ steps.tools.outputs.list }}"
            ${{ inputs.extra_claude_args }}

      - name: Post-run (caller-supplied)
        if: ${{ inputs.post_run != '' && steps.claude.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GH_REPO: ${{ github.repository }}
          NOTIFY_NTFY_TOPIC: ${{ secrets.NOTIFY_NTFY_TOPIC }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          POST_RUN: ${{ inputs.post_run }}
        run: bash -euo pipefail -c "$POST_RUN"

      # v2's after-the-model steps (loop_gates), as the kit's march.yml
      # and night.yml run them: the tick's quota reading and its cache
      # (the next run's gate reads the newest), the weekly-quota pause,
      # and for march the idle record (the gate job's probe state comes
      # back from its cache) and the one-line no-op reason.
      - name: Quota read
        id: quota
        if: ${{ always() && inputs.loop_gates != '' && (steps.claude.outcome == 'success' || steps.claude.outcome == 'failure') }}
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          grep -qx '.nexus/' .git/info/exclude 2>/dev/null || echo '.nexus/' >> .git/info/exclude
          node scripts/cloud/quota.mjs read "$EXEC_FILE"

      - name: Quota cache save
        if: ${{ always() && steps.quota.outputs.quota != '' }}
        uses: actions/cache/save@v4
        with:
          path: .nexus/quota.json
          key: nexus-quota-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Pause on the weekly quota
        if: ${{ always() && steps.quota.outputs.status == 'rejected' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESETS: ${{ steps.quota.outputs.resets }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/cloud/quota.mjs pause --resets "$RESETS" --run-url "$RUN_URL"

      - name: Idle cache restore
        if: ${{ always() && inputs.loop_gates == 'march' && steps.claude.outcome != 'skipped' }}
        uses: actions/cache/restore@v4
        with:
          path: .nexus/idle.json
          key: nexus-idle-${{ github.run_id }}
          restore-keys: nexus-idle-

      - name: Idle record
        id: idle_record
        if: ${{ always() && inputs.loop_gates == 'march' && (steps.claude.outcome == 'success' || steps.claude.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REASON: ${{ inputs.reason }}
          MAIN: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/cloud/idle.mjs record --event "$EVENT" --reason "$REASON" --main "$MAIN" --run-url "$RUN_URL"

      - name: Idle cache save
        if: ${{ always() && inputs.loop_gates == 'march' && hashFiles('.nexus/idle.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .nexus/idle.json
          key: nexus-idle-${{ github.run_id }}-${{ github.run_attempt }}

      - name: No-op reason
        if: ${{ always() && inputs.loop_gates == 'march' }}
        env:
          LANDED: ${{ steps.idle_record.outputs.landed }}
          QUOTA_STATUS: ${{ steps.quota.outputs.status }}
          RESETS: ${{ steps.quota.outputs.resets }}
          MODEL: ${{ steps.claude.outcome }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: node scripts/cloud/idle.mjs noop --landed "$LANDED" --quota-status "$QUOTA_STATUS" --resets "$RESETS" --model "$MODEL" "$EXEC_FILE" || true

      # The Stop hook writes the tick's `tick-end` row (and any row after
      # the tick's last commit) to its telemetry shard once Claude has
      # already committed and pushed. On an attended machine the next tick
      # carries it; here the runner is torn down, so without this step no
      # CI tick's shard ever reached main with its `tick-end` row (audit,
      # 2026-10-09). Only `telemetry/` is staged: anything else a tick left
      # uncommitted stays uncommitted. Best-effort, like the hook itself —
      # a telemetry push must never fail a tick.
      - name: Commit stranded telemetry rows
        if: ${{ always() && steps.claude.outcome != 'skipped' }}
        continue-on-error: true
        shell: bash
        env:
          GIT_AUTHOR_NAME: claude[bot]
          GIT_AUTHOR_EMAIL: 41898282+claude[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: claude[bot]
          GIT_COMMITTER_EMAIL: 41898282+claude[bot]@users.noreply.github.com
          CLAUDE_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
        run: |
          # The Stop hook sometimes loses the tick-end row (three march ticks
          # on 2026-10-11 ended with none). tick-close writes it from the
          # action's execution file, only when the shard lacks one.
          if [ -n "$CLAUDE_EXECUTION_FILE" ] && [ -f "$CLAUDE_EXECUTION_FILE" ]; then
            node .claude/hooks/telemetry.mjs tick-close "$CLAUDE_EXECUTION_FILE" || true
          fi
          git add -- telemetry/
          if git diff --cached --quiet; then
            echo "No stranded telemetry rows."
            exit 0
          fi
          # Push to the branch the tick ended on, never across branches
          # (R11): a PR tick (`loop/*`) ends on its PR branch, and
          # `pull --rebase origin main` from there would replay the PR's
          # commits onto main and push them to main. The rows ride the
          # PR instead; any other branch is left alone.
          branch="$(git rev-parse --abbrev-ref HEAD)"
          case "$branch" in
            loop/*|"${GITHUB_REF_NAME}") ;;
            *) echo "::warning::HEAD is '$branch', not ${GITHUB_REF_NAME} or loop/*; telemetry rows not pushed."; exit 0 ;;
          esac
          git commit -m "telemetry: tick-end rows for run ${GITHUB_RUN_ID}" -- telemetry/
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$branch" && git push origin "HEAD:$branch" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::warning::Could not push stranded telemetry rows after 3 attempts."

      - name: Fail if Claude reported an execution error
        if: ${{ always() && steps.claude.outputs.execution_file != '' }}
        shell: bash
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = process.env.CLAUDE_EXECUTION_FILE;
          const raw = fs.readFileSync(path, 'utf8');
          const data = JSON.parse(raw);
          const events = Array.isArray(data) ? data : [data];
          const failing = events.find((event) => event && event.is_error === true);
          if (failing) {
            const status = failing.api_error_status || failing.error_status || 'unknown';
            const error = failing.error || 'unknown_error';
            const result = typeof failing.result === 'string' ? failing.result : JSON.stringify(failing.result || {});
            console.error(`Claude execution failed: status=${status} error=${error}`);
            console.error(result);
            process.exit(1);
          }
          NODE
