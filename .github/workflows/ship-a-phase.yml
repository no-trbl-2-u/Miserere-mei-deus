name: ship-a-chunk

# Ship the next unchecked phase of the build plan end-to-end (see
# skills/ship-a-chunk.md). Dispatch-only — /march dispatches to it when a
# pending phase exists; run this directly to force a delivery tick.

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: nexus-loop
  cancel-in-progress: false

jobs:
  ship:
    uses: ./.github/workflows/_claude-skill.yml
    secrets: inherit
    with:
      extra_claude_args: |
        -p
        --dangerously-skip-permissions
      prompt: '/ship-a-chunk'
      timeout_minutes: 120
