name: march

# The autonomous-beast tick: /march dispatches triage → critique →
# ship-a-chunk → expand → iterate and executes one tick end-to-end (see
# skills/march.md; in revamp mode, D58, phases are revamp phases only). Scheduled every 2 hours (raised from every 6 hours at
# T's request on 2026-09-01; reason not stated); adjust or delete the cron
# to retune, or run it by hand from the Actions tab. Ticks share
# the nexus-loop concurrency group, so a long tick makes the next one
# queue (and GitHub keeps only the newest queued run) — the loop
# self-throttles instead of stacking.
#
# PAUSED 2026-10-12 for Phase R11: disabled on GitHub (`gh workflow
# disable march`), not by editing this file. R11's exit step (item 9 in
# plan/revamp/loop.md) re-enables it. See plan/bearings.md § Operational notes.

on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:
    inputs:
      focus_phase:
        description: 'Optional chunk id (NN.k, for example 113.4) or spec number (NN) for this manual run, passed to /ship-a-chunk. Empty runs normal /march dispatch.'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: nexus-loop
  cancel-in-progress: false

jobs:
  march:
    uses: ./.github/workflows/_claude-skill.yml
    secrets: inherit
    with:
      extra_claude_args: |
        -p
        --dangerously-skip-permissions
      prompt: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.focus_phase != '' && format('/ship-a-chunk {0}', github.event.inputs.focus_phase) || '/march' }}
      # Typical tick is ~23 min; at least one wedged run burned the full
      # 90-min budget (2026-08 usage review), which is why the ceiling
      # dropped 90->75 (b53dac5d, 2026-08-14). Raising it further is off
      # the table (plan/bearings.md § Operational notes: "a tick that
      # genuinely needs more should be split, not have its cap raised
      # silently") — the fix is skills/ship-a-chunk.md §7 Hard Rule 12
      # (one phase per invocation, never chain), added by Phase 92
      # (2026-09-18) after the chained-phase incident that hit this
      # ceiling exactly. Re-measured at Phase 92: last 100 runs, 0
      # cancellations, 53.3 min slowest — comfortable headroom under 75.
      timeout_minutes: 75
      # /march can dispatch into /critique (rate-limited: ≥12 commits +
      # ≥24h, green deploy), which drives the local expo-web build with the
      # playtester sub-agent over Playwright. Without this the browser tools
      # are not granted, the playtester is denied `browser_navigate`, and the
      # critique tick no-ops (empty findings, no commit) while reporting
      # success — and since it never advances CRITIQUE.md's last-pass marker,
      # every following tick re-dispatches to the same dead end and starves
      # pending phases. Grant Playwright so a march-dispatched critique runs.
      install_playwright: true
      # Pinned to Opus 5.5: /march runs every sub-skill it dispatches
      # (triage, critique, ship-a-chunk, expand, iterate) inside this one session,
      # so this pin is what sets the model for the whole tick.
      model: 'claude-opus-5-5'
