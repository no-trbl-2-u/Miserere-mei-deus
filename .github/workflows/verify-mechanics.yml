name: verify-mechanics

# Sole owner for mechanics and root dependency changes. Mobile consumes
# mechanics as local source, so this job detects the documented cross-package
# impact paths and runs the affected consumer gate in the same installed
# environment. Each known subsystem selects its own browser journey;
# shared, lockfile, workflow, classifier, and unknown-history changes fail
# closed to the full suite.

on:
  push:
    branches: [main]
    paths:
      - 'axiomancer-mechanics/**'
      - 'scripts/ci-e2e-scope.mjs'
      - 'scripts/ci-e2e-scope.test.mjs'
      - '.github/workflows/verify-mechanics.yml'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'axiomancer-mechanics/**'
      - 'scripts/ci-e2e-scope.mjs'
      - 'scripts/ci-e2e-scope.test.mjs'
      - '.github/workflows/verify-mechanics.yml'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: verify-mechanics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: mechanics + affected consumers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout full history for impact detection
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workspace dependencies once
        run: npm ci

      - name: Determine affected consumers and browser journeys
        id: impact
        shell: bash
        run: |
          set -euo pipefail

          force_full=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=200 origin "${{ github.base_ref }}" 2>/dev/null \
              || git fetch --no-tags origin "${{ github.base_ref }}" 2>/dev/null || true
            base="$(git merge-base "origin/${{ github.base_ref }}" HEAD 2>/dev/null || true)"
            if [ -n "$base" ]; then
              range="$base...HEAD"
            else
              range="HEAD~1..HEAD"
              force_full=true
            fi
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="HEAD~1..HEAD"
            force_full=true
          fi

          changed="$(git diff --name-only "$range")"
          printf 'diff range: %s\nchanged files:\n%s\n' "$range" "$changed"
          if [ "$force_full" = true ]; then
            printf '%s\n' "$changed" | node scripts/ci-e2e-scope.mjs mechanics --full | tee -a "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$changed" | node scripts/ci-e2e-scope.mjs mechanics | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Check retired terminology
        run: node scripts/check-lexicon.mjs

      - name: Test E2E scope classifier
        run: node --test scripts/ci-e2e-scope.test.mjs

      - name: Skip-comment gate
        run: node automation/check-skip-comments.mjs
        working-directory: axiomancer-mechanics

      - name: Verify mechanics (type-check + tests + build)
        run: npm run verify --workspace axiomancer-mechanics

      - name: Verify mobile against affected mechanics
        if: steps.impact.outputs.mobile == 'true'
        run: npm run verify --workspace axiomancer-mobile

      - name: Export and inspect the affected mobile bundle once
        if: steps.impact.outputs.run_integration == 'true'
        run: npm run smoke:bundler --workspace axiomancer-mobile
        env:
          BUILD_PROFILE: preview
          SMOKE_BUNDLER_TIMEOUT_MS: '480000'
          SMOKE_BUNDLER_OUTPUT_DIR: '.smoke-dist'

      - name: Install Playwright Chromium
        if: steps.impact.outputs.run_integration == 'true'
        run: npx playwright install --with-deps chromium

      - name: Hazard playthrough (both routes)
        if: steps.impact.outputs.hazard == 'true'
        run: npm run e2e:hazard --workspace axiomancer-mobile

      - name: Encounter routing (every minigame trigger to its screen)
        if: steps.impact.outputs.encounters == 'true'
        run: npm run e2e:encounters --workspace axiomancer-mobile

      # State-fixture boot (docs/state-fixtures.md): `?fixture=<id>` deep link,
      # `__AXM_FIXTURE__` inline fixture with `arrive`, unknown-id fallback.
      # Cheap (three cold boots, no playthrough) and touches app/_layout.tsx,
      # so it rides every integration run rather than one subsystem journey.
      - name: State-fixture boot (deep link + inline + fallback)
        if: steps.impact.outputs.run_integration == 'true'
        run: npm run e2e:fixture --workspace axiomancer-mobile

      # Plays real rounds of the live fight on the /combat-encounter route
      # (real deck, real enemy, the persistOutcome write-back) — stage, power
      # with a die, APPLY, END PHASE, to a terminal outcome — and fails on an
      # uncaught exception or the <ErrorBoundary> screen, which no other
      # journey does. Three seeds keep this near two minutes; the local
      # `e2e:combat-round` default sweeps wider.
      - name: Combat full rounds (live, crash-strict)
        if: steps.impact.outputs.combat == 'true'
        run: npm run e2e:combat-round --workspace axiomancer-mobile
        env:
          COMBAT_ROUND_E2E_SEEDS: '16,8,3'

      # CRITIQUE.md [HIGH] 2026-08-19: 30 prior runs of the step above never
      # reproduced the reported mid-combat crash because they only ever drove
      # a standard foe, the spare-mercy branch, and the fresh 4-card starter
      # deck. These three cover the axes that were missing: a boss fight with
      # a non-starter (sage) deck, the reveal screen's WITHDRAW retreat, and
      # a won fight with a pending level-up that cascades post-victory.
      - name: Combat full rounds — boss + non-starter deck (crash-strict)
        if: steps.impact.outputs.combat == 'true'
        run: npm run e2e:combat-round:boss --workspace axiomancer-mobile
        env:
          COMBAT_ROUND_E2E_SEEDS: '16,8'

      - name: Combat reveal withdraw (crash-strict)
        if: steps.impact.outputs.combat == 'true'
        run: npm run e2e:combat-round:withdraw --workspace axiomancer-mobile
        env:
          COMBAT_ROUND_E2E_SEEDS: '16'

      - name: Combat victory with pending level-up (crash-strict)
        if: steps.impact.outputs.combat == 'true'
        run: npm run e2e:combat-round:levelup --workspace axiomancer-mobile
        env:
          COMBAT_ROUND_E2E_SEEDS: '16,8'

      # AUDIT.md [3.5] "Verify gate is blind to the Playwright journeys":
      # these scripts had no CI trigger at all — not in `verify`, not
      # as a workflow step — so a regression on any of them could reach
      # main with a fully green build. `ci-e2e-scope.mjs` has no suite of
      # its own for any of them; each rides the existing scope output that
      # already covers the surface it exercises.
      - name: Theme switch (live repaint, no reload)
        if: steps.impact.outputs.run_integration == 'true'
        run: npm run e2e:theme --workspace axiomancer-mobile

      - name: Exploration <-> combat round trip (and mid-fight reload)
        if: steps.impact.outputs.encounters == 'true'
        run: npm run e2e:exploration-roundtrip --workspace axiomancer-mobile

      - name: Labyrinth <-> combat round trip
        if: steps.impact.outputs.encounters == 'true'
        run: npm run e2e:labyrinth-roundtrip --workspace axiomancer-mobile
