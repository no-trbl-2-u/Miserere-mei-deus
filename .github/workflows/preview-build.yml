name: preview-build

# Manually-triggered EAS build of the mobile app. Runs the verify gate, then
# (optionally) the visual smoke screens, then an EAS build from the mobile
# package directory (where eas.json + app config live). Automatic scheduling
# was removed 2026-07-13; preview builds run only by attended dispatch.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all
      profile:
        description: 'EAS build profile'
        required: true
        default: 'preview'
        type: string
      run_visual_verify:
        description: 'Run visual smoke screens (verify:visual) before building'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: preview-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: EAS preview build (${{ inputs.platform || 'android' }}, ${{ inputs.profile || 'preview' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PREVIEW_PLATFORM: ${{ inputs.platform || 'android' }}
      PREVIEW_PROFILE: ${{ inputs.profile || 'preview' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Run verify gate
        run: npm run verify --workspace axiomancer-mobile

      - name: Run visual smoke screens
        if: inputs.run_visual_verify == true
        run: npm run verify:visual --workspace axiomancer-mobile

      # The solve-time API (phase BE1c): a dev-tools build posts each ended
      # /devpuzzle attempt when both EXPO_PUBLIC_PUZZLE_API_* values are baked
      # in. An EAS cloud build does not see this runner's env, but it archives
      # the working tree, so the values go into the profile's `env` in this
      # checkout's eas.json (never committed). Skipped for production, and
      # when either secret is unset the build simply never posts.
      - name: Pass the puzzle API values to the build
        if: env.PREVIEW_PROFILE != 'production'
        working-directory: axiomancer-mobile
        env:
          EXPO_PUBLIC_PUZZLE_API_URL: ${{ secrets.EXPO_PUBLIC_PUZZLE_API_URL }}
          EXPO_PUBLIC_PUZZLE_API_TOKEN: ${{ secrets.EXPO_PUBLIC_PUZZLE_API_TOKEN }}
        run: |
          if [ -z "$EXPO_PUBLIC_PUZZLE_API_URL" ] || [ -z "$EXPO_PUBLIC_PUZZLE_API_TOKEN" ]; then
            echo "puzzle API secrets not set: this build will not post attempts"
            exit 0
          fi
          jq --arg p "$PREVIEW_PROFILE" \
            '.build[$p].env = ((.build[$p].env // {}) + {
               EXPO_PUBLIC_PUZZLE_API_URL: env.EXPO_PUBLIC_PUZZLE_API_URL,
               EXPO_PUBLIC_PUZZLE_API_TOKEN: env.EXPO_PUBLIC_PUZZLE_API_TOKEN })' \
            eas.json > eas.json.tmp && mv eas.json.tmp eas.json
          echo "puzzle API values passed to the $PREVIEW_PROFILE profile"

      - name: EAS build
        working-directory: axiomancer-mobile
        run: npx eas-cli@latest build --platform "$PREVIEW_PLATFORM" --profile "$PREVIEW_PROFILE" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
