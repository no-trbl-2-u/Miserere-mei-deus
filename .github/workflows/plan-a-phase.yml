name: plan-a-spec

# Refine the next phase brief without shipping code (see
# skills/plan-a-spec.md). Dispatch-only.

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: nexus-loop
  cancel-in-progress: false

jobs:
  plan:
    uses: ./.github/workflows/_claude-skill.yml
    secrets: inherit
    with:
      extra_claude_args: |
        -p
        --dangerously-skip-permissions
      prompt: '/plan-a-spec'
      timeout_minutes: 45
