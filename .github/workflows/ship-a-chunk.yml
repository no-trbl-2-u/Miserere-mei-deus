name: ship-a-chunk

# Ship the next ready chunk of the plan end-to-end (see
# skills/ship-a-chunk.md; v2's own chunk step is /next, which /march
# runs as /next top). Dispatch-only; run this directly to force a
# delivery tick. The file was ship-a-phase.yml until v2's verb names
# (phase NX1f).

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: nexus-loop
  cancel-in-progress: false

jobs:
  ship:
    uses: ./.github/workflows/_claude-skill.yml
    secrets: inherit
    with:
      extra_claude_args: |
        -p
        --dangerously-skip-permissions
      prompt: '/ship-a-chunk'
      timeout_minutes: 120
