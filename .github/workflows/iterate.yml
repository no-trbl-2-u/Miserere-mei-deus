name: iterate

# One improvement tick: /iterate audits the project, picks the
# highest-impact weakness, ships one fix end-to-end (see skills/iterate.md).
# Dispatch-only — /march already dispatches to iterate on schedule; run
# this directly when you want an extra quality pass without a full march.
#
# Model tier: this standalone workflow runs Opus 5.5 at medium effort (a
# deliberate quality pass is worth the premium model). March-dispatched
# iterate ticks run inside the march session, which is also pinned to
# Opus 5.5 (see march.yml).

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: nexus-loop
  cancel-in-progress: false

jobs:
  iterate:
    uses: ./.github/workflows/_claude-skill.yml
    secrets: inherit
    with:
      extra_claude_args: |
        -p
        --dangerously-skip-permissions
      prompt: '/iterate'
      timeout_minutes: 90
      model: 'opus'
      effort: 'medium'
