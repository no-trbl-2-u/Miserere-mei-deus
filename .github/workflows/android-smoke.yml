name: android-smoke

# The attended Android smoke test (spec 125, phase LG1i, A9): a preview APK
# on an emulator, driven by the Maestro flow in
# axiomancer-mobile/.maestro/android-smoke.yaml from the title to the end of
# one combat round. Manual only: a run with no build id builds a fresh preview
# APK with EXPO_TOKEN, which spends EAS build minutes, so T approves that one
# (A8). Given an existing EAS build id it spends none. Each run is recorded in
# docs/reports/android-smoke.md.

on:
  push:
    branches: [loop/next-125.9]
  workflow_dispatch:
    inputs:
      build_id:
        description: 'An existing EAS Android build id (uuid). Empty builds a fresh preview APK (spends EAS minutes).'
        required: false
        default: ''
        type: string
      api_level:
        description: 'Emulator Android API level'
        required: false
        default: '34'
        type: string

permissions:
  contents: read

concurrency:
  group: android-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Android smoke (${{ inputs.build_id || 'fresh preview build' }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SMOKE_BUILD_ID: ${{ inputs.build_id }}
      SMOKE_API_LEVEL: ${{ inputs.api_level || '34' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the inputs
        run: |
          if [ -n "$SMOKE_BUILD_ID" ] && ! [[ "$SMOKE_BUILD_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "::error::build_id is not an EAS build uuid: $SMOKE_BUILD_ID"
            exit 1
          fi
          if ! [[ "$SMOKE_API_LEVEL" =~ ^[0-9]{2}$ ]]; then
            echo "::error::api_level is not a two-digit API level: $SMOKE_API_LEVEL"
            exit 1
          fi

      # A fresh build only: the same EAS build preview-build runs, waited on.
      - name: Setup Node 22
        if: env.SMOKE_BUILD_ID == ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workspace dependencies
        if: env.SMOKE_BUILD_ID == ''
        run: npm ci

      - name: Build a fresh preview APK
        id: fresh
        if: env.SMOKE_BUILD_ID == ''
        working-directory: axiomancer-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::the repo secret EXPO_TOKEN is not set"
            exit 1
          fi
          npx eas-cli@latest build --platform android --profile preview --non-interactive --wait --json > "$RUNNER_TEMP/eas-build.json"
          id="$(jq -r '.[0].id' "$RUNNER_TEMP/eas-build.json")"
          echo "built EAS build $id"
          echo "build_id=$id" >> "$GITHUB_OUTPUT"

      # One lookup for both paths, so a fresh build and a given id resolve the same way.
      - name: Resolve the APK
        id: apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          FRESH_BUILD_ID: ${{ steps.fresh.outputs.build_id }}
        run: |
          id="${SMOKE_BUILD_ID:-$FRESH_BUILD_ID}"
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::the repo secret EXPO_TOKEN is not set"
            exit 1
          fi
          jq -n --arg id "$id" '{query: "query($id: ID!) { builds { byId(buildId: $id) { id status platform buildProfile gitCommitHash artifacts { buildUrl } } } }", variables: {id: $id}}' > "$RUNNER_TEMP/query.json"
          curl -fsS https://api.expo.dev/graphql \
            -H "Authorization: Bearer $EXPO_TOKEN" -H 'content-type: application/json' \
            -d @"$RUNNER_TEMP/query.json" > "$RUNNER_TEMP/build.json"
          b='.data.builds.byId'
          status="$(jq -r "$b.status // empty" "$RUNNER_TEMP/build.json")"
          platform="$(jq -r "$b.platform // empty" "$RUNNER_TEMP/build.json")"
          url="$(jq -r "$b.artifacts.buildUrl // empty" "$RUNNER_TEMP/build.json")"
          commit="$(jq -r "$b.gitCommitHash // empty" "$RUNNER_TEMP/build.json")"
          profile="$(jq -r "$b.buildProfile // empty" "$RUNNER_TEMP/build.json")"
          if [ "$status" != "FINISHED" ] || [ "$platform" != "ANDROID" ] || [[ "$url" != *.apk ]]; then
            echo "::error::EAS build $id is not a finished Android APK (status '$status', platform '$platform', artifact '$url')"
            exit 1
          fi
          curl -fsSL -o "$RUNNER_TEMP/app.apk" "$url"
          echo "EAS build $id ($profile, commit $commit): $(du -h "$RUNNER_TEMP/app.apk" | cut -f1)"
          {
            echo "build_id=$id"
            echo "commit=$commit"
            echo "profile=$profile"
          } >> "$GITHUB_OUTPUT"

      # GitHub's Linux runners expose /dev/kvm only after this udev rule.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ ! -e /dev/kvm ]; then
            echo "::error::this runner has no /dev/kvm: record it in docs/reports/android-smoke.md and use the adb variant there"
            exit 1
          fi
          ls -l /dev/kvm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maestro
        env:
          MAESTRO_VERSION: '2.12.1'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME/.maestro-cli"
          echo "$HOME/.maestro-cli/maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro-cli/maestro/bin/maestro" --version

      - name: Run the smoke flow on an emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.SMOKE_API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash axiomancer-mobile/.maestro/run-android-smoke.sh "$RUNNER_TEMP/app.apk" "$RUNNER_TEMP/android-smoke"

      - name: Upload the screenshots and the flow log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/android-smoke
          if-no-files-found: warn
          retention-days: 30

      - name: Summary
        if: always()
        env:
          BUILD_ID: ${{ steps.apk.outputs.build_id }}
          BUILD_COMMIT: ${{ steps.apk.outputs.commit }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## android-smoke: $JOB_STATUS"
            echo
            echo "- EAS build: \`${BUILD_ID:-none}\` (commit \`${BUILD_COMMIT:-unknown}\`)"
            echo "- Emulator: API $SMOKE_API_LEVEL, google_apis x86_64, pixel_6"
            echo "- Artifact: \`android-smoke-$GITHUB_RUN_ID\` (shots/, debug/, maestro.log, report.xml, logcat.txt, failure.png on a failure)"
            echo
            echo "Record this run in docs/reports/android-smoke.md."
          } >> "$GITHUB_STEP_SUMMARY"
