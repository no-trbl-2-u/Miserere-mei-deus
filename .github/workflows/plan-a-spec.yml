name: plan-a-spec

# Write, refine or chunk one spec without shipping code (see
# skills/plan-a-spec.md). Dispatch-only: since R11 only T runs it (by
# hand or this button), and the loop never writes a brief. The file was
# plan-a-phase.yml until v2's verb names (phase NX1f).

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: nexus-loop
  cancel-in-progress: false

jobs:
  plan:
    uses: ./.github/workflows/_claude-skill.yml
    secrets: inherit
    with:
      extra_claude_args: |
        -p
        --dangerously-skip-permissions
      prompt: '/plan-a-spec'
      timeout_minutes: 45
