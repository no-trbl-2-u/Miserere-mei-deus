name: expand

# Plan-expansion pass: /expand reads accumulated signals (audit, critique,
# issues, spec drift) and proposes new phase candidates to
# plan/CANDIDATES.md (see skills/expand.md). Dispatch-only —
# /march runs it rate-limited and posture-gated; candidates are promoted
# to real phases only via /oversight.

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: nexus-loop
  cancel-in-progress: false

jobs:
  expand:
    uses: ./.github/workflows/_claude-skill.yml
    secrets: inherit
    with:
      extra_claude_args: |
        -p
        --dangerously-skip-permissions
      prompt: '/expand'
      timeout_minutes: 45
