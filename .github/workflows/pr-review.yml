name: pr-review

# The PR review pipeline (phase RV1, `plan/phases/phase_RV1_pr_review_pipeline.md`;
# design in `docs/reports/pr-review-research.md` Part 3).
#
# Job `verify-gate` (RV1a) is the one always-reporting check on every
# same-repo PR into main. The `verify-*` workflows are path-filtered, so
# none of them can be a required check (a required `verify-mobile` that
# never runs on a mechanics-only PR blocks it forever). `verify-gate`
# always reports: it labels the PR with the risk tier `scripts/pr-risk.mjs`
# derives, fails on a changed path no `verify-*` filter owns and that is
# not bookkeeping, naming it (LG1b; `verify-root` owns what the root
# `npm test` checks), fails on a ticked acceptance line in the PR body
# that names no proof (LG1c, `scripts/pr-acceptance.mjs`), fails on an
# added test file that passes on the merge base and carries no
# `guard-test:` reason (LG1d, `scripts/pr-review.mjs parent-tests --gate`), then waits for
# every `verify-*` the diff triggers on this head and is green only when all of them are (`scripts/pr-gate.mjs`).
# A ruleset in evaluate mode requires it; T creates that ruleset with the
# command in `.github/workflows/README.md`.
#
# `pull_request`, never `pull_request_target`: a fork's head never sees a
# secret, and this file only ever runs for heads in this repo. No `labeled`
# trigger: `gh pr create --label` fired one run per label, each cancelling
# the one before, and a cancelled `verify-gate` check run on the head left
# the ruleset reading the head as not green (#667, 2026-10-20). The label is
# written with the workflow's own token, which starts no new workflow run. Nothing here merges, auto-merges, closes or
# force-pushes a PR (D86); `scripts/loop-pr.test.mjs` pins all of it.
#
# Job `review` (RV1b) is the adversarial reviewer: after a green
# `verify-gate`, on every open, non-draft, same-repo PR that is not a plan
# (D95; plans skipped since T, 2026-10-21, dispatch still reviews one; through RV2
# only `loop:pr` and `plot`), one Claude run of `skills/review.md` posts
# inline MED/HIGH findings and one `## Review verdict` comment, and may
# raise (never lower) the `risk:*` label. The ruleset requires
# `verify-gate` only; a not-pass is a comment that job `merge` reads.
# `review-wanted` decides on a plain runner first (`scripts/pr-review.mjs`:
# drafts, seeded drafts, plans, once per head, and once per diff, phase RV2), so a
# label-only event costs no Claude run, and a merge of main or a rebase
# that leaves the PR's diff unchanged costs none either. At most two
# passes per PR (T, 2026-10-20): the second runs only when a not-pass was
# fixed and pushed; after it the PR is labelled `review:exhausted` and
# waits for T (a dispatch still reviews it). The digest comes from `gh pr diff`, so this job stays a sparse
# depth-1 checkout. The reviewer reads, comments and
# labels; it cannot edit, commit, push, merge or close (grant and deny list
# below, pinned in `scripts/loop-pr.test.mjs`). The `workflow_dispatch`
# route reviews one PR on demand (phase RV1c's seeded `eval:seed` drafts).
#
# The run fans out to Sonnet sub-agents from a manifest
# `scripts/pr-partition.mjs` derives from the diff (phase RV3): one reader
# per module of changed source, each owning its files and their importers
# and told what not to report, capped by tier (2 / 3 / 6) and each read by
# a logic reader and a seams reader, plus the Tests
# lens and, on medium and high, a control adversary that reads the whole
# diff unpartitioned. All are merged into the one verdict, overlap counted.
#
# Job `merge` (D95, amends D86) runs on a plain runner after `review`, in
# the same run: `scripts/pr-merge.mjs decide` merges a PR only when it is
# not a plot PR (label `plot`, or a `plot:` title; D101),
# no hold label is on it (`review:needs-T`, `loop:pr-stuck`, `eval:seed`,
# `no-auto-merge`), this run's review posted a `pass` verdict naming the
# exact head, GitHub calls the PR CLEAN, and the
# repository variable `PR_AUTO_MERGE` is not `off`. Then it posts an audit
# comment and runs `gh pr merge --auto --merge`: GitHub's active ruleset
# (a required `verify-gate`) is the last word, never a comment match. The
# reviewer itself still cannot merge, close, push or commit.
#
# Cost: GitHub-hosted runners, free for this public repo. Claude usage: one
# run per reviewed head of every same-repo PR, at `effort: high`, plus up
# to fourteen Sonnet sub-agents on a high tier (six assignments x 2, Tests, control).

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to review (loop:pr, plot or eval:seed; drafts allowed)'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  verify-gate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Job-level and per PR: a new push or label supersedes the gate on the old state.
    concurrency:
      group: pr-review-gate-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout full history (the risk tier diffs package.json at the merge base)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Label the derived risk tier
        run: node scripts/pr-risk.mjs --pr "$PR" --apply

      # Plan files are bookkeeping, so the root `npm test` below skips a
      # plan-only PR, which is where a pr-resolve merge splits a queue row.
      # The queue lint has no dependencies and runs on every PR (phase LG1a).
      - name: Plan-queue lint
        run: node scripts/check-plan-queues.mjs

      - name: Classify the diff against the verify-* path filters
        id: classify
        run: node scripts/pr-gate.mjs classify --pr "$PR"

      # Every ticked `- [x] A<n>` line in the body's Acceptance section
      # names a test file, shot or command on the head, or a `(no test:
      # <reason>)` listed for T (phase LG1c). It reads the body live, so a
      # re-run of this job checks an edited body.
      - name: Acceptance proof in the PR body
        run: node scripts/pr-acceptance.mjs --pr "$PR" --head "$HEAD_SHA"

      # A test file the PR adds must fail on the merge base with its own
      # version laid over, or carry a `guard-test: <reason>` comment (phase
      # LG1d). Dependencies are installed only when there is one to run.
      - name: Count the test files the PR adds
        id: added
        run: node scripts/pr-review.mjs parent-tests --pr "$PR" --head "$HEAD_SHA" --gate --list

      - name: Install dependencies for the parent replay
        if: steps.added.outputs.count != '0'
        run: npm ci --no-audit --no-fund

      - name: Fail-on-parent for added tests
        if: steps.added.outputs.count != '0'
        run: node scripts/pr-review.mjs parent-tests --pr "$PR" --head "$HEAD_SHA" --gate

      - name: Wait for every triggered verify-* on this head
        run: node scripts/pr-gate.mjs wait --pr "$PR" --head "$HEAD_SHA"

  review-wanted:
    needs: verify-gate
    # always(): on workflow_dispatch the gate is skipped, and a skipped
    # need would skip this job too.
    if: always() && (github.event_name == 'workflow_dispatch' || needs.verify-gate.result == 'success')
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.wanted.outputs.go }}
      pr: ${{ steps.wanted.outputs.pr }}
      head: ${{ steps.wanted.outputs.head }}
      digest: ${{ steps.wanted.outputs.digest }}
      reuse: ${{ steps.wanted.outputs.reuse }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event_name == 'workflow_dispatch' && inputs.pr || github.event.pull_request.number }}
      DISPATCH: ${{ github.event_name == 'workflow_dispatch' && '--dispatch' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decide (draft, seeded draft, once per head, once per diff, two passes)
        id: wanted
        run: node scripts/pr-review.mjs wanted --pr "$PR" $DISPATCH
      - name: Label the PR for T when the pass cap is reached
        if: steps.wanted.outputs.exhausted == 'true'
        run: gh pr edit "$PR" --repo "$GH_REPO" --add-label review:exhausted

  review:
    needs: review-wanted
    if: always() && needs.review-wanted.outputs.go == 'true'
    # Job-level and per PR: a new head's review replaces the old one's.
    concurrency:
      group: pr-review-${{ needs.review-wanted.outputs.pr }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    uses: ./.github/workflows/_claude-skill.yml
    secrets: inherit
    with:
      # The PR's head may edit skills/review.md or the reviewer's scripts;
      # the reviewer runs main's copies from .review-tooling/ (the skill and
      # all of scripts/, so their imports resolve), and the PR's own tree
      # stays whole so its tests run as the PR wrote them. .claude/,
      # CLAUDE.md, AGENTS.md and .mcp.json are harness config and are
      # restored in place.
      pre_run: |
        git fetch --no-tags origin main
        rm -rf .review-tooling && mkdir -p .review-tooling
        git archive origin/main skills/review.md scripts | tar -x -C .review-tooling
        for p in .claude CLAUDE.md AGENTS.md .mcp.json; do
          if git cat-file -e "origin/main:$p" 2>/dev/null; then git checkout origin/main -- "$p"; fi
        done
      prompt: 'Read .review-tooling/skills/review.md end to end and follow it for PR #${{ needs.review-wanted.outputs.pr }}. Head ${{ needs.review-wanted.outputs.head }}, diff digest ${{ needs.review-wanted.outputs.digest || ''unavailable'' }}.'
      allowed_tools: 'Read,Grep,Glob,Task,TodoWrite,Bash(git diff:*),Bash(git show:*),Bash(git log:*),Bash(git fetch:*),Bash(git rev-parse:*),Bash(npm test:*),Bash(node --test:*),Bash(node .review-tooling/scripts/pr-review.mjs parent-tests:*),Bash(node .review-tooling/scripts/pr-partition.mjs:*),Bash(node .review-tooling/scripts/pr-risk.mjs:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr edit:*),mcp__github_inline_comment__create_inline_comment'
      # Deny beats the allow list in .claude/settings.json, which a loop
      # tick needs and a reviewer must not have.
      extra_claude_args: |
        -p
        --disallowedTools "Edit,Write,MultiEdit,NotebookEdit,Bash(git push:*),Bash(git commit:*),Bash(gh pr merge:*),Bash(gh pr close:*),Bash(gh api:*)"
      effort: 'high'
      # 40: a high tier fans out to as many as fourteen Sonnet sub-agents (RV3).
      timeout_minutes: 40

  merge:
    needs: [review-wanted, review]
    # The review job's own success is not the verdict (a not-pass exits 0);
    # the decision reads the verdict comment. A failed or cancelled review
    # posts no verdict, so the decision holds on its own; the `if` only
    # spares a runner.
    # Also after a reused verdict (an unchanged diff on a new head, the
    # review job skipped): the decision finds that verdict by its digest.
    if: always() && ((needs.review-wanted.outputs.go == 'true' && needs.review.result == 'success') || needs.review-wanted.outputs.reuse == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
    concurrency:
      group: pr-merge-${{ needs.review-wanted.outputs.pr }}
      cancel-in-progress: false
    env:
      # GH_PAT, so the merge's push to main fires pr-resolve, deadlines and
      # the other push workflows; github.token would not. The decision reads
      # the head's own verify-gate check run; the ruleset is the second lock.
      GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ needs.review-wanted.outputs.pr }}
      HEAD_SHA: ${{ needs.review-wanted.outputs.head }}
      PR_AUTO_MERGE: ${{ vars.PR_AUTO_MERGE }}
    steps:
      # main's scripts, never the PR's: a PR could otherwise rewrite the
      # decision that merges it.
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: When this run's review started (a verdict older than this is not its verdict)
        id: since
        run: node scripts/pr-merge.mjs since --run "$GITHUB_RUN_ID"
      - name: Decide (plan PR, holds, this run's verdict on this head, CLEAN, cap, kill switch)
        id: decide
        run: node scripts/pr-merge.mjs decide --pr "$PR" --head "$HEAD_SHA" --since "${{ steps.since.outputs.since }}" --digest "${{ needs.review-wanted.outputs.digest }}"
      - name: Auto-merge (GitHub's ruleset decides), then the audit comment
        if: steps.decide.outputs.go == 'true'
        run: |
          gh pr merge "$PR" --repo "$GH_REPO" --auto --merge --match-head-commit "$HEAD_SHA"
          gh pr comment "$PR" --repo "$GH_REPO" --body "$(node scripts/pr-merge.mjs audit --pr "$PR" --head "$HEAD_SHA" --run "$GITHUB_RUN_ID")" || echo "::warning::merge requested; the audit comment failed"
      - name: Hold
        if: steps.decide.outputs.go != 'true'
        env:
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          echo "::notice::PR $PR not merged: $REASON"

  # The fixer (D95, T 2026-10-20): a not-pass is fixed on the PR's branch by
  # a run that is not the reviewer, once per PR; its push is the second and
  # last automated pass. Plain-runner gate first, so a hold costs no Claude
  # run; the fix job runs main's copy of skills/review-fix.md.
  fix-wanted:
    needs: [review-wanted, merge]
    if: always() && needs.review-wanted.outputs.go == 'true' && needs.merge.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.wanted.outputs.go }}
      branch: ${{ steps.wanted.outputs.branch }}
      head: ${{ steps.wanted.outputs.head }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ needs.review-wanted.outputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decide (trusted not-pass on this head, no attempt yet, not a plan, hold or pipeline PR)
        id: wanted
        run: node scripts/pr-review.mjs fix-wanted --pr "$PR"

  fix:
    needs: [review-wanted, fix-wanted]
    if: always() && needs.fix-wanted.outputs.go == 'true'
    concurrency:
      group: pr-review-fix-${{ needs.review-wanted.outputs.pr }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    uses: ./.github/workflows/_claude-skill.yml
    secrets: inherit
    with:
      # Switch to the PR branch first, then lay main's harness config over
      # it as unstaged local changes (a restore before the switch aborts it
      # when the branch differs on those paths). The skill never stages them.
      pre_run: |
        git fetch --no-tags origin main "${{ needs.fix-wanted.outputs.branch }}"
        git switch "${{ needs.fix-wanted.outputs.branch }}"
        rm -rf .review-tooling && mkdir -p .review-tooling
        git archive origin/main skills/review-fix.md | tar -x -C .review-tooling
        for p in .claude CLAUDE.md AGENTS.md .mcp.json; do
          if git cat-file -e "origin/main:$p" 2>/dev/null; then git checkout origin/main -- "$p"; fi
        done
      prompt: 'Read .review-tooling/skills/review-fix.md end to end and follow it: fix the not-pass on PR #${{ needs.review-wanted.outputs.pr }}, branch ${{ needs.fix-wanted.outputs.branch }}, head ${{ needs.fix-wanted.outputs.head }}.'
      allowed_tools: 'Read,Edit,Write,Grep,Glob,TodoWrite,Bash(git fetch:*),Bash(git switch:*),Bash(git pull:*),Bash(git status:*),Bash(git diff:*),Bash(git show:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push origin:*),Bash(npm test:*),Bash(npm run verify:*),Bash(node --test:*),Bash(gh pr view:*),Bash(gh pr diff:*)'
      extra_claude_args: |
        -p
        --disallowedTools "Bash(gh pr comment:*),Bash(gh pr edit:*),Bash(gh pr merge:*),Bash(gh pr close:*),Bash(gh api:*),Bash(git push --force:*),Bash(git push -f:*),Bash(git rebase:*),Bash(git merge:*),Bash(git reset:*)"
      timeout_minutes: 30
