name: claude

# Interactive @claude responder: mention @claude in any issue or PR
# comment (or open an issue mentioning it) and Claude answers / implements
# in that thread. Tag mode — no prompt input, the mention is the prompt.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      # A plot PR: T answering its "Your calls" by comment (T, 2026-10-25).
      # Only T's own comment on a PR labelled plot is routed; everything
      # else runs exactly as before (no extra argument).
      - name: Route T's answers on a plot PR
        id: route
        env:
          IS_PLOT: ${{ contains(github.event.issue.labels.*.name, 'plot') || contains(github.event.pull_request.labels.*.name, 'plot') }}
          IS_PR: ${{ github.event.issue.pull_request != null || github.event.pull_request != null }}
          BY_OWNER: ${{ github.event.sender.login == github.repository_owner }}
        run: |
          if [ "$IS_PLOT" = "true" ] && [ "$IS_PR" = "true" ] && [ "$BY_OWNER" = "true" ]; then
            echo "args=--append-system-prompt \"This comment is T's, on a plot PR. Read skills/plot.md and follow its section 7.4, Answering T's calls, exactly: parse the answers, rewrite the spec, its roadmap row and any part-plan or deadline lines they touch, regenerate the PR body, rerun the deadline lint, push to this branch without force, and reply on the PR with what changed.\"" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GH_PAT || github.token }}
          show_full_output: true
          claude_args: |
            -p
            --dangerously-skip-permissions
            --model claude-opus-5-5
            --allowedTools "Bash,Edit,Write,Read,Glob,Grep,Task,TodoWrite,WebFetch,WebSearch"
            ${{ steps.route.outputs.args }}
