name: pr-resolve

# Keeps loop PRs mergeable (Phase R11, D87). On every push to main, each
# open same-repo `loop:pr` or `plot` PR GitHub reports CONFLICTING gets main
# merged into its branch by `scripts/pr-resolve.mjs scan`: conflicts only in
# append-only files (telemetry shards, plan queues, lessons) settle by a
# union of rows; anything else goes to a Haiku run with Read and Edit only
# (skills/fix-ci.md §3.6), between a scripted prepare and finish. Push,
# never force. The loop never merges a PR (D86).
#
# Two event shapes, one file:
#   - push / bare workflow_dispatch -> `scan`. For each PR it cannot settle
#     by union it starts one `workflow_dispatch` run of this file with
#     `branch` and `pr` set.
#   - workflow_dispatch with `branch` -> `resolve` (the Claude step).
# The split exists because anthropics/claude-code-action rejects a `push`
# event ("Unsupported event type: push"); every Claude resolve on the push
# run failed in 0.3s until 2026-10-14 (AUDIT [infra], issue #524).
#
# Cost: free runners (public repo); Claude usage only when a conflict is
# outside the union files.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'loop/* branch to resolve with Claude. Empty = run the scan.'
        required: false
        type: string
        default: ''
      pr:
        description: 'PR number for that branch (prompt only)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  id-token: write

jobs:
  scan:
    if: github.event_name == 'push' || inputs.branch == ''
    runs-on: ubuntu-latest
    # Job-level and its own group (never nexus-loop): one scan at a time,
    # and a later push's scan waits rather than displacing this one.
    concurrency:
      group: pr-resolve
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
      GH_REPO: ${{ github.repository }}
      GIT_AUTHOR_NAME: claude[bot]
      GIT_AUTHOR_EMAIL: 41898282+claude[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: claude[bot]
      GIT_COMMITTER_EMAIL: 41898282+claude[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # GH_PAT so the merge push re-runs the PR's verify-* checks.
          token: ${{ secrets.GH_PAT || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge main into conflicting loop PRs
        id: scan
        run: node scripts/pr-resolve.mjs scan
      # One dispatched run per conflicted PR: workflow_dispatch is an event
      # claude-code-action accepts, and a dispatch made with GITHUB_TOKEN
      # still starts a run (it is exempt from the no-recursion rule).
      - name: Dispatch a Claude resolve per conflicted PR
        if: steps.scan.outputs.claude != '' && steps.scan.outputs.claude != '[]'
        env:
          ITEMS: ${{ steps.scan.outputs.claude }}
        run: |
          echo "$ITEMS" | jq -c '.[]' | while read -r item; do
            branch=$(echo "$item" | jq -r '.branch')
            pr=$(echo "$item" | jq -r '.pr')
            echo "dispatching a resolve for #$pr ($branch)"
            gh workflow run pr-resolve.yml --repo "$GH_REPO" --ref main \
              -f branch="$branch" -f pr="$pr"
          done

  resolve:
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.branch, 'loop/')
    # One resolve per branch at a time; a second dispatch for the same
    # branch waits for the first.
    concurrency:
      group: pr-resolve-${{ inputs.branch }}
      cancel-in-progress: false
    uses: ./.github/workflows/_claude-skill.yml
    secrets: inherit
    with:
      extra_claude_args: |
        -p
        --permission-mode acceptEdits
      allowed_tools: 'Read,Edit'
      pre_run: |
        git config user.name 'claude[bot]'
        git config user.email '41898282+claude[bot]@users.noreply.github.com'
        node scripts/pr-resolve.mjs prepare --branch '${{ inputs.branch }}'
      post_run: |
        git config user.name 'claude[bot]'
        git config user.email '41898282+claude[bot]@users.noreply.github.com'
        node scripts/pr-resolve.mjs finish --branch '${{ inputs.branch }}'
      prompt: '/fix-ci --resolve ${{ inputs.branch }} (PR #${{ inputs.pr }}). The conflicted files are listed one per line in .git/pr-resolve-files.txt.'
      model: 'claude-haiku-5-5'
      timeout_minutes: 30
