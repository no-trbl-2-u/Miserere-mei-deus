name: sim-runs

# The bots post their own data (phase SM1g) and what breaks gets filed (SM2d).
# Plays whole Chapter 1 runs headlessly through the app's own store actions, one
# bot at a time, and posts each run to the miserere-api Worker through the app's
# own posters, every row stamped `source: sim` (`npm run sim:run -- --post`).
# T's reports read `human` unless told otherwise, and `card-vs-bot` sets T beside
# these.
#
# Which bots: the four player personas (cautious, reckless, explorer, rusher)
# play on the schedule and after every successful `preview-build` (its
# `head_sha`, so every APK T plays has the bots' rows at its build). The lane
# bots (blood-price, defender, merciful, elementalist) run only by hand:
# `workflow_dispatch` takes `bots`: `personas` (default), `lanes`, or `all`
# (personas, lane bots and the wanderer). 5 runs per bot by default.
#
# Breaks: each batch writes its breaks (a crash, a stuck run, a stuck fight, a
# quest no road can finish, a node left unresolved) to a JSON-lines file
# (`--breaks`); the filing step (`npm run sim:breaks`) opens one GitHub issue per
# new break key, labelled `bug` and `sim-break` so /triage routes it as a bug. It
# runs `if: always()` after the batch, so a crash still gets filed, and only on
# the scheduled run and a dispatch at `main`: a preview-build run plays and
# posts only.
#
# Report: after the batch, a second job (`report`, `needs: sim`, `if: always()`, the
# scheduled run and a dispatch at `main` only) runs `npm run sim:report` at the
# batch's sha, which reads the sim's rows back from the Worker and commits
# `docs/reports/sim/latest.md` and one line of `history.jsonl` to main by
# `measured-truth`'s push path (the `nexus-loop` group, `claude[bot]`, four tries
# of pull --rebase and push). It runs after a failed batch too, so a night with
# breaks still reports.
#
# A measurement, not a gate (D57): the batch step fails only when the driver
# crashes, a run sticks, a fight sticks or a post is refused, never on a number
# or on the two end-of-run checks, and the job is never a required check.
# `measured-truth` is unchanged and separate.
#
# Reads the repo secrets EXPO_PUBLIC_PUZZLE_API_URL (the Worker's origin, which
# the preview build bakes into the APK) and PUZZLE_API_TOKEN (the shared bearer
# the Worker holds). Without them it fails naming the missing one, since a
# silent dry run would look like a green batch.

on:
  workflow_run:
    workflows: [preview-build]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or sha to play (default: main)'
        type: string
        default: 'main'
      runs:
        description: 'Runs per bot'
        type: string
        default: '5'
      bots:
        description: 'Which bots: personas (default), lanes (the four lane bots) or all (personas, lane bots and the wanderer)'
        type: choice
        options: [personas, lanes, all]
        default: personas
  schedule:
    - cron: '43 3 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: sim-runs
  cancel-in-progress: false

jobs:
  sim:
    name: Play and post the bots
    # A scheduled run plays main; a workflow_run plays the commit the build was made from.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    env:
      SIM_REF: ${{ github.event.workflow_run.head_sha || inputs.ref || 'main' }}
      SIM_RUNS: ${{ inputs.runs || '5' }}
      SIM_BOTS: ${{ inputs.bots || 'personas' }}
      # Breaks are filed by the scheduled run and a dispatch at main only.
      SIM_FILES_BREAKS: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.ref || 'main') == 'main')) && 'true' || 'false' }}
      GH_TOKEN: ${{ github.token }}
      PUZZLE_API_URL: ${{ secrets.EXPO_PUBLIC_PUZZLE_API_URL }}
      PUZZLE_API_TOKEN: ${{ secrets.PUZZLE_API_TOKEN }}
    steps:
      - name: Check the secrets and the run count
        run: |
          missing=""
          [ -n "$PUZZLE_API_URL" ] || missing="$missing EXPO_PUBLIC_PUZZLE_API_URL"
          [ -n "$PUZZLE_API_TOKEN" ] || missing="$missing PUZZLE_API_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::sim-runs needs the repo secret(s):$missing"
            exit 1
          fi
          case "$SIM_RUNS" in
            ''|*[!0-9]*|0) echo "::error::runs must be a positive integer, not '$SIM_RUNS'"; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SIM_REF }}

      - name: Record the sha the bots play
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      # One batch: every bot shares this run's id as its session id. A failing
      # bot does not stop the others; the step fails at the end.
      - name: Play and post the bots
        run: |
          case "$SIM_BOTS" in
            personas) policies="cautious reckless explorer rusher" ;;
            lanes) policies="blood-price defender merciful elementalist" ;;
            all) policies="cautious reckless explorer rusher blood-price defender merciful elementalist wanderer" ;;
            *) echo "::error::bots must be personas, lanes or all, not '$SIM_BOTS'"; exit 1 ;;
          esac
          SIM_BREAKS_FILE="$RUNNER_TEMP/sim-breaks.jsonl"
          SIM_LEDGER_FILE="$RUNNER_TEMP/sim-ledger.jsonl"
          : > "$SIM_BREAKS_FILE"
          : > "$SIM_LEDGER_FILE"
          failed=""
          for policy in $policies; do
            echo "::group::$policy"
            npm run sim:run -- --policy "$policy" --runs "$SIM_RUNS" --seed 1 --post --breaks "$SIM_BREAKS_FILE" --ledger "$SIM_LEDGER_FILE" || failed="$failed $policy"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::sim:run failed for:$failed"
            exit 1
          fi

      # One issue per new break key (never a failing check on a number). Runs
      # after a failed batch too, so a crash is still filed.
      - name: File the breaks as issues
        if: always() && env.SIM_FILES_BREAKS == 'true'
        run: npm run sim:breaks -- --file "$RUNNER_TEMP/sim-breaks.jsonl"

      # The breaks file rides to the report job, which lists each break with its issue;
      # the run ledger rides with it, for the arrival and money tables.
      - name: Keep the breaks for the report
        if: always() && env.SIM_FILES_BREAKS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sim-breaks
          path: |
            ${{ runner.temp }}/sim-breaks.jsonl
            ${{ runner.temp }}/sim-ledger.jsonl
          if-no-files-found: ignore
          retention-days: 3

  # The report T reads. Runs after the batch whatever its result, on the scheduled
  # run and a dispatch at main (a preview-build run plays and posts only). A
  # dispatch from another branch never commits there: it must run at main too.
  report:
    name: Write the nightly report
    needs: sim
    if: always() && needs.sim.result != 'skipped' && needs.sim.outputs.sha != '' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && (inputs.ref || 'main') == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Joins the loop's group so this commit queues behind a tick instead of racing its push.
    concurrency:
      group: nexus-loop
      cancel-in-progress: false
    permissions:
      contents: write
      issues: read
    env:
      GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
      GH_REPO: ${{ github.repository }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PUZZLE_API_URL: ${{ secrets.EXPO_PUBLIC_PUZZLE_API_URL }}
      PUZZLE_API_TOKEN: ${{ secrets.PUZZLE_API_TOKEN }}
      SIM_SHA: ${{ needs.sim.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Fetch the night's breaks
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: sim-breaks
          path: ${{ runner.temp }}/sim-breaks

      # A refused read, or a missing URL or token, fails here and writes nothing.
      - name: Write the report
        run: |
          breaks=""
          [ -f "$RUNNER_TEMP/sim-breaks/sim-breaks.jsonl" ] && breaks="--breaks $RUNNER_TEMP/sim-breaks/sim-breaks.jsonl"
          ledger=""
          [ -f "$RUNNER_TEMP/sim-breaks/sim-ledger.jsonl" ] && ledger="--ledger $RUNNER_TEMP/sim-breaks/sim-ledger.jsonl"
          npm run sim:report -- --build "$SIM_SHA" $breaks $ledger

      - name: Commit the report
        shell: bash
        env:
          GIT_AUTHOR_NAME: claude[bot]
          GIT_AUTHOR_EMAIL: 41898282+claude[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: claude[bot]
          GIT_COMMITTER_EMAIL: 41898282+claude[bot]@users.noreply.github.com
        run: |
          git add -- docs/reports/sim/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "sim: nightly report $(date -u +%F)"
          branch="${GITHUB_REF_NAME}"
          # A run queued behind another report measured an older commit, so both
          # append a line to history.jsonl and rewrite latest.md. Keep main's lines
          # plus this run's new one, and this run's latest.md.
          resolve_report() {
            local f
            for f in $(git diff --name-only --diff-filter=U); do
              case "$f" in
                docs/reports/sim/history.jsonl)
                  { git show ":2:$f"; git show ":3:$f" | tail -n 1; } > "$f" ;;
                docs/reports/sim/latest.md)
                  git show ":3:$f" > "$f" ;;
                *) return 1 ;;
              esac
              git add -- "$f"
            done
            GIT_EDITOR=true git rebase --continue
          }
          for delay in 2 4 8 16; do
            { git pull --rebase origin "$branch" || resolve_report; } \
              && git push origin "HEAD:$branch" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep "$delay"
          done
          echo "::error::Could not push the sim report after 4 attempts."
          exit 1
