name: verify-mobile

# Mobile-owned verification. Mechanics and root lockfile changes are owned by
# verify-mechanics, which runs affected consumer gates itself. This job installs
# once, verifies once, exports once when integration evidence is required, and
# runs only the browser journeys owned by the changed subsystem. Shared or
# unknown runtime paths fail closed to all journeys. The weekly/manual lane is
# the unconditional full-suite backstop.

on:
  push:
    branches: [main]
    paths:
      - 'axiomancer-mobile/**'
      - '.github/workflows/verify-mobile.yml'
      # The worklet guard scans this package, so a change to the guard itself
      # must re-run it — otherwise a weakened guard lands green.
      - 'scripts/check-worklets.mjs'
      - 'scripts/check-worklets.test.mjs'
      # Same reason, mirrored: `assets:check` reads the world-plate catalogue,
      # which lives outside this package. Without this line a catalogue-only
      # edit re-breaks the register and never re-runs the guard that caught it.
      - 'docs/art-catalog.json'
  pull_request:
    branches: [main]
    paths:
      - 'axiomancer-mobile/**'
      - '.github/workflows/verify-mobile.yml'
      - 'scripts/check-worklets.mjs'
      - 'scripts/check-worklets.test.mjs'
      - 'docs/art-catalog.json'
  schedule:
    - cron: '13 7 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: verify-mobile-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify + affected Playwright journeys
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout full history for suite routing
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Determine affected browser journeys
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          force_full=false
          if [ "${{ github.event_name }}" = "schedule" ] \
            || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            range="HEAD~1..HEAD"
            force_full=true
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=200 origin "${{ github.base_ref }}" 2>/dev/null \
              || git fetch --no-tags origin "${{ github.base_ref }}" 2>/dev/null || true
            base="$(git merge-base "origin/${{ github.base_ref }}" HEAD 2>/dev/null || true)"
            if [ -n "$base" ]; then
              range="$base...HEAD"
            else
              range="HEAD~1..HEAD"
              force_full=true
            fi
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="HEAD~1..HEAD"
            force_full=true
          fi

          changed="$(git diff --name-only "$range")"
          printf 'diff range: %s\nchanged files:\n%s\n' "$range" "$changed"
          if [ "$force_full" = true ]; then
            printf '%s\n' "$changed" | node scripts/ci-e2e-scope.mjs mobile --full | tee -a "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$changed" | node scripts/ci-e2e-scope.mjs mobile | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Install workspace dependencies
        run: npm ci

      - name: Check retired terminology
        run: node scripts/check-lexicon.mjs

      # CRITIQUE.md [HIGH] 2026-08-29 (post-combat reward ACCEPT crash) was
      # root-caused to a Reanimated worklet calling a plain JS function
      # (EnemyActionCard.tsx). `check-worklets.mjs` is the static guard for that
      # WHOLE class — it scans mobile components/, app/, lib/ and hooks/ — but
      # it had NO CI trigger of any kind: not in the mobile verify gate, not as
      # a workflow step, and the root `npm test` that carries its unit suite
      # runs nowhere in CI either. So the one guard standing between us and a
      # repeat of a crash that took three user reports and ~30 seeded runs to
      # pin was local-only, and a regression could reach main fully green.
      # It costs ~0.25s. Same shape as every other guard step in this file.
      - name: Check Reanimated worklets (no plain-JS calls inside a worklet)
        run: npm run lint:worklets

      - name: Test the worklet guard itself
        run: node --test scripts/check-worklets.test.mjs

      - name: Test E2E scope classifier
        run: node --test scripts/ci-e2e-scope.test.mjs

      - name: Run mobile verify gate
        run: npm run verify --workspace axiomancer-mobile

      - name: Export and inspect the web bundle once
        if: steps.scope.outputs.run_integration == 'true'
        run: npm run smoke:bundler --workspace axiomancer-mobile
        env:
          BUILD_PROFILE: preview
          SMOKE_BUNDLER_TIMEOUT_MS: '480000'
          SMOKE_BUNDLER_OUTPUT_DIR: '.smoke-dist'

      - name: Install Playwright Chromium
        if: steps.scope.outputs.run_integration == 'true'
        run: npx playwright install --with-deps chromium

      - name: Hazard playthrough (both routes)
        if: steps.scope.outputs.hazard == 'true'
        run: npm run e2e:hazard --workspace axiomancer-mobile

      - name: Encounter routing (every minigame trigger to its screen)
        if: steps.scope.outputs.encounters == 'true'
        run: npm run e2e:encounters --workspace axiomancer-mobile

      # State-fixture boot (docs/state-fixtures.md): `?fixture=<id>` deep link,
      # `__AXM_FIXTURE__` inline fixture with `arrive`, unknown-id fallback.
      # Cheap (three cold boots, no playthrough) and touches app/_layout.tsx,
      # so it rides every integration run rather than one subsystem journey.
      - name: State-fixture boot (deep link + inline + fallback)
        if: steps.scope.outputs.run_integration == 'true'
        run: npm run e2e:fixture --workspace axiomancer-mobile

      # Keep in step with verify-mechanics.yml — the two workflows carry
      # parallel copies of this journey list, and a step added to only one of
      # them silently skips whichever PR shape triggers the other. (Witness:
      # eb51e84 added this to verify-mechanics only, so a mobile-only PR — the
      # exact shape that introduced the harness — ran a green build that never
      # executed it.)
      #
      # Plays real rounds of the live fight on the /combat-encounter route
      # (real deck, real enemy, the persistOutcome write-back) — stage, power
      # with a die, APPLY, END PHASE, to a terminal outcome — and fails on an
      # uncaught exception or the <ErrorBoundary> screen, which no other
      # journey does. Three seeds keep this near two minutes; the local
      # `e2e:combat-round` default sweeps wider.
      - name: Combat full rounds (live, crash-strict)
        if: steps.scope.outputs.combat == 'true'
        run: npm run e2e:combat-round --workspace axiomancer-mobile
        env:
          COMBAT_ROUND_E2E_SEEDS: '16,8,3'

      # CRITIQUE.md [HIGH] 2026-08-19: 30 prior runs of the step above never
      # reproduced the reported mid-combat crash because they only ever drove
      # a standard foe, the spare-mercy branch, and the fresh 4-card starter
      # deck. These three cover the axes that were missing: a boss fight with
      # a non-starter (sage) deck, the reveal screen's WITHDRAW retreat, and
      # a won fight with a pending level-up that cascades post-victory.
      - name: Combat full rounds — boss + non-starter deck (crash-strict)
        if: steps.scope.outputs.combat == 'true'
        run: npm run e2e:combat-round:boss --workspace axiomancer-mobile
        env:
          COMBAT_ROUND_E2E_SEEDS: '16,8'

      - name: Combat reveal withdraw (crash-strict)
        if: steps.scope.outputs.combat == 'true'
        run: npm run e2e:combat-round:withdraw --workspace axiomancer-mobile
        env:
          COMBAT_ROUND_E2E_SEEDS: '16'

      - name: Combat victory with pending level-up (crash-strict)
        if: steps.scope.outputs.combat == 'true'
        run: npm run e2e:combat-round:levelup --workspace axiomancer-mobile
        env:
          COMBAT_ROUND_E2E_SEEDS: '16,8'

      # AUDIT.md [3.5] "Verify gate is blind to the Playwright journeys":
      # these scripts had no CI trigger at all — not in `verify`, not
      # as a workflow step — so a regression on any of them could reach
      # main with a fully green build. `ci-e2e-scope.mjs` has no suite of
      # its own for any of them; each rides the existing scope output that
      # already covers the surface it exercises.
      - name: Theme switch (live repaint, no reload)
        if: steps.scope.outputs.run_integration == 'true'
        run: npm run e2e:theme --workspace axiomancer-mobile

      - name: Exploration <-> combat round trip (and mid-fight reload)
        if: steps.scope.outputs.encounters == 'true'
        run: npm run e2e:exploration-roundtrip --workspace axiomancer-mobile

      - name: Labyrinth <-> combat round trip
        if: steps.scope.outputs.encounters == 'true'
        run: npm run e2e:labyrinth-roundtrip --workspace axiomancer-mobile

      # A new game walked node to node on the start map: arrival, cache,
      # gathering, a fight to its end, and the hazard route. World/** and the
      # map layouts both select the encounter suite (or the full one).
      - name: Map walk (new game, node to node)
        if: steps.scope.outputs.encounters == 'true'
        run: npm run e2e:map-walk --workspace axiomancer-mobile
