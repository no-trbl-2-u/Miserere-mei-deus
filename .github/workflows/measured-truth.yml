name: measured-truth

# The measured-truth run (phase R12a). Measures the grey deck and the Blood
# Price and Elementalist test decks (plus Blood Price half-upgraded) across
# every Act 1 ledger fight at three stat spreads with the greedy witness, two
# sampled families (elementalist~20of30 and mixed~20of60, `draws` seeded
# draws each, reported as median and range) and every deck's VITAE lost to its
# own INFERNO (phase EM1); appends one line to docs/reports/measured/history.jsonl,
# rewrites docs/reports/measured/latest.md, and files a `[content]` row in
# plan/AUDIT.md (plus its issue) for each drift past thresholds.json against
# the previous line. A measurement, not a gate (D57): a number never fails this
# workflow; only a measurer crash does.
#
# Runs on every merge to main that touches the engine's source, on Sundays at
# 07:37 UTC (after perf-audit at 07:07), and by hand. It joins the nexus-loop
# group so its commit queues behind a loop tick instead of racing that tick's
# push. Its output is generated data plus AUDIT rows, plan-only under D84, so
# it commits to main directly.

on:
  push:
    branches: [main]
    paths:
      - 'axiomancer-mechanics/src/**'
  schedule:
    - cron: '37 7 * * 0'
  workflow_dispatch:
    inputs:
      runs:
        description: 'Seeded runs per cell'
        type: string
        default: '300'
      draws:
        description: 'Seeded draws per sampled family'
        type: string
        default: '16'

permissions:
  contents: write
  issues: write

concurrency:
  group: nexus-loop
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Measure
        id: measure
        env:
          RUNS: ${{ inputs.runs || '300' }}
          DRAWS: ${{ inputs.draws || '16' }}
        run: npm run measured:truth -- "--runs=${RUNS}" --seed=1 "--draws=${DRAWS}"

      - name: Commit the report
        shell: bash
        env:
          GIT_AUTHOR_NAME: claude[bot]
          GIT_AUTHOR_EMAIL: 41898282+claude[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: claude[bot]
          GIT_COMMITTER_EMAIL: 41898282+claude[bot]@users.noreply.github.com
          DRIFTS: ${{ steps.measure.outputs.drifts }}
        run: |
          git add -- docs/reports/measured/ plan/AUDIT.md
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "measured: truth run $(date -u +%F) — ${DRIFTS:-0} drift(s)"
          branch="${GITHUB_REF_NAME}"
          # A run queued behind another truth run measured an older commit, so
          # its report collides with the one that landed meanwhile: both append
          # a line to history.jsonl and rewrite latest.md. Keep main's lines
          # plus this run's new one, and this run's latest.md. Any other
          # conflict (plan/AUDIT.md) still fails the rebase.
          resolve_report() {
            local f
            for f in $(git diff --name-only --diff-filter=U); do
              case "$f" in
                docs/reports/measured/history.jsonl)
                  { git show ":2:$f"; git show ":3:$f" | tail -n 1; } > "$f" ;;
                docs/reports/measured/latest.md)
                  git show ":3:$f" > "$f" ;;
                *) return 1 ;;
              esac
              git add -- "$f"
            done
            GIT_EDITOR=true git rebase --continue
          }
          for delay in 2 4 8 16; do
            { git pull --rebase origin "$branch" || resolve_report; } \
              && git push origin "HEAD:$branch" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep "$delay"
          done
          echo "::error::Could not push the measured-truth report after 4 attempts."
          exit 1
