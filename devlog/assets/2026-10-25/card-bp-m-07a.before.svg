<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400" role="img" aria-label="Feeding Mark">
  <title>Feeding Mark</title>
  <desc>VULNERABLE +25% for 2 turns; HEAL 2 each time you damage the foe while it lasts.</desc>
  <style>
    .plate { fill: #15110c; }
    .name { font-family: Georgia, 'Times New Roman', serif; font-size: 19px; fill: #ece0c8; }
    .free { font-family: ui-monospace, Menlo, monospace; font-size: 13px; fill: #dcb04a; }
    .paid { font-family: Georgia, 'Times New Roman', serif; font-size: 12.5px; fill: rgba(236,224,200,0.78); }
    .note { font-family: ui-monospace, Menlo, monospace; font-size: 10px; fill: #9c937f; }
    .rule { stroke: rgba(236,224,200,0.14); stroke-width: 1; }
  </style>
  <rect class="plate" x="0.5" y="0.5" width="299" height="399" fill="#15110c" stroke="#9a5fd0" stroke-width="2"/>
  <text x="14" y="30" class="name">Feeding Mark</text>
  <line class="rule" x1="14" y1="52" x2="286" y2="52"/>
  <text x="14" y="78" class="free"></text>
  <line class="rule" x1="14" y1="94" x2="286" y2="94"/>
  <text x="14" y="116" class="paid">VULNERABLE +25% for 2 turns; HEAL 2</text><text x="14" y="134" class="paid">each time you damage the foe while it</text><text x="14" y="152" class="paid">lasts.</text>
  <line class="rule" x1="14" y1="366" x2="286" y2="366"/>
  <text x="14" y="384" class="note">as it stood before</text>
</svg>
